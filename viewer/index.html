<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>dbd-hillclimb viewer</title>
<style>
  :root { color-scheme: dark; font: 13px/1.35 system-ui, sans-serif; }
  body { margin: 0; display: grid; grid-template-columns: 1fr 340px; height: 100vh; background: #111; color: #ddd; }
  #view { position: relative; overflow: hidden; }
  #view canvas { display: block; }
  #hud { position: absolute; left: 10px; top: 10px; background: #000a; padding: 8px 10px; border-radius: 6px; pointer-events: none; min-width: 220px; }
  #hud .row { display: flex; gap: 8px; align-items: center; }
  .dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
  #side { overflow-y: auto; padding: 10px 12px; background: #1a1a1a; border-left: 1px solid #333; }
  h2 { font-size: 13px; margin: 14px 0 6px; color: #9ab; text-transform: uppercase; letter-spacing: .05em; }
  button, select, input { background: #2a2a2a; color: #ddd; border: 1px solid #444; border-radius: 4px; padding: 3px 7px; font: inherit; }
  button.on { background: #3b5; color: #000; }
  .bar { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; }
  #log { font: 11px/1.3 ui-monospace, monospace; max-height: 180px; overflow-y: auto; white-space: pre; color: #aaa; }
  #params { font: 11px/1.3 ui-monospace, monospace; white-space: pre; color: #bbb; }
  #chart { width: 100%; height: 150px; background: #151515; border: 1px solid #333; border-radius: 4px; }
  #genInfo { color: #aaa; }
  .legend span { margin-right: 8px; }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
} }
</script>
</head>
<body>
<div id="view"><div id="hud"></div></div>
<div id="side">
  <h2>Match</h2>
  <div class="bar">
    <button id="play">Pause</button>
    <span>speed</span>
    <select id="speed"><option>1</option><option>2</option><option selected>4</option><option>8</option><option>16</option><option>32</option></select>
    <button id="cam">Top-down</button>
    <label title="where the hunter believes survivors are"><input type="checkbox" id="heat" checked> hunter belief</label>
  </div>
  <div class="bar" style="margin-top:6px">
    <span>seed</span><input id="seed" type="number" value="1" style="width:80px">
    <button id="restart">Restart</button><button id="random">Random seed</button>
  </div>
  <div class="bar" style="margin-top:6px"><span>map</span><select id="map" style="flex:1"></select></div>
  <div class="legend" style="margin-top:6px">pallets: <span style="color:#f2d24b">■ upright (tall board)</span><span style="color:#ff5a1f">■ dropped (slab)</span><span style="color:#8a6d50">■ broken (splinters)</span></div>
  <div class="legend">hunter glow: <span style="color:#d33">■ lunging</span><span style="color:#7a8fcc">■ attack cooldown (slowed)</span><span style="color:#cc3">■ stunned</span></div>

  <h2>Meta (hill-climb run)</h2>
  <div class="bar"><select id="run" style="max-width:100%"></select></div>
  <canvas id="chart" width="600" height="300"></canvas>
  <div id="knobBox" style="display:none;margin-top:6px">
    <div class="bar"><span>knob</span><select id="knob" style="flex:1"></select></div>
    <canvas id="knobChart" width="600" height="300" style="width:100%;height:150px;background:#151515;border:1px solid #333;border-radius:4px;margin-top:4px"></canvas>
  </div>
  <div class="legend"><span style="color:#e55">■ avg kills</span><span style="color:#5be">■ gens done</span><span style="color:#999">▲ accepted (red=hunter, blue=surv)</span></div>
  <div class="bar" style="margin-top:6px">
    <span>generation</span><input id="gen" type="range" min="0" max="0" value="0" style="flex:1">
  </div>
  <div id="genInfo"></div>
  <div class="bar" style="margin-top:4px">
    <label><input type="checkbox" id="useChamp" checked> play this generation's champions</label>
  </div>
  <h2>Champion params</h2>
  <div id="params"></div>

  <h2>Events</h2>
  <div id="log"></div>
</div>
<script type="module" src="./main.js"></script>
</body>
</html>
