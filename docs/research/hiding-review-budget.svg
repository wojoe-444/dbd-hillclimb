<svg xmlns="http://www.w3.org/2000/svg" width="980" height="344" viewBox="0 0 980 344" role="img" aria-labelledby="title desc"><title id="title">More hiding currently costs repair time</title><desc id="desc">Stacked bars show percentages of healthy or injured survivor time spent repairing, hiding or peeking, and all other activity. Four paired 32-match policies use seeds 1000 to 1031 and the tile variant pool.</desc><rect width="980" height="344" fill="#f8fafc"/><g font-family="Arial, sans-serif" fill="#172033"><text x="24" y="34" font-size="22" font-weight="bold">More hiding currently costs repair time</text><text x="24" y="59" font-size="14">Standing survivor time, 32 paired tile-pool matches per policy</text><text x="795" y="91" font-size="13">Gens / fitness</text><text x="24" y="131" font-size="15">Default</text><rect x="155" y="110" width="192.51845681856636" height="30" fill="#087f8c"/><rect x="347.5184568185664" y="110" width="9.036210027472219" height="30" fill="#e69f00"/><rect x="356.5546668460386" y="110" width="398.4453331539614" height="30" fill="#d8e0ea"/><text x="168" y="130" font-size="14" fill="white">32.1% repair</text><text x="795" y="131" font-size="15">3.125 / 0.283</text><text x="24" y="175" font-size="15">Hiding on</text><rect x="155" y="154" width="172.23714012189077" height="30" fill="#087f8c"/><rect x="327.2371401218908" y="154" width="80.24493894038743" height="30" fill="#e69f00"/><rect x="407.4820790622782" y="154" width="347.5179209377218" height="30" fill="#d8e0ea"/><text x="168" y="174" font-size="14" fill="white">28.7% repair</text><text x="332.2371401218908" y="174" font-size="13">13.4%</text><text x="795" y="175" font-size="15">2.094 / 0.219</text><text x="24" y="219" font-size="15">On + walk</text><rect x="155" y="198" width="153.34984509130553" height="30" fill="#087f8c"/><rect x="308.3498450913055" y="198" width="81.79889388976086" height="30" fill="#e69f00"/><rect x="390.1487389810664" y="198" width="364.8512610189336" height="30" fill="#d8e0ea"/><text x="168" y="218" font-size="14" fill="white">25.6% repair</text><text x="313.3498450913055" y="218" font-size="13">13.6%</text><text x="795" y="219" font-size="15">1.906 / 0.214</text><text x="24" y="263" font-size="15">On + run</text><rect x="155" y="242" width="180.32662635473488" height="30" fill="#087f8c"/><rect x="335.3266263547349" y="242" width="69.21557671349004" height="30" fill="#e69f00"/><rect x="404.5422030682249" y="242" width="350.4577969317751" height="30" fill="#d8e0ea"/><text x="168" y="262" font-size="14" fill="white">30.1% repair</text><text x="340.3266263547349" y="262" font-size="13">11.5%</text><text x="795" y="263" font-size="15">2.688 / 0.253</text><rect x="155" y="298" width="14" height="14" fill="#087f8c"/><text x="176" y="310" font-size="13">Repair</text><rect x="255" y="298" width="14" height="14" fill="#e69f00"/><text x="276" y="310" font-size="13">Hide / peek (moving or still)</text><rect x="485" y="298" width="14" height="14" fill="#d8e0ea"/><text x="506" y="310" font-size="13">Other activity</text><text x="24" y="334" font-size="11">Current policies only; these results do not establish that well-planned hiding is ineffective.</text></g></svg>
